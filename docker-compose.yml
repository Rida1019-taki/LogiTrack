services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db

    environment:
      MYSQL_DATABASE: LogiTrack
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    networks:
      - monitoring-network

    restart: always

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  logitrack-api:
    build: .

    container_name: logitrack-api

    ports:
      - "8080:8080"

    networks:
      - monitoring-network

    depends_on:
      mysql-db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/LogiTrack?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.yml:/etc/prometheus/alert.yml:ro

    ports:
      - "9090:9090"

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    networks:
      - monitoring-network

    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    ports:
      - "9093:9093"

    networks:
      - monitoring-network

    restart: unless-stopped


  loki:
    image: grafana/loki:latest
    container_name: loki

    ports:
      - "3100:3100"

    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    networks:
      - monitoring-network

    restart: unless-stopped


  promtail:
    image: grafana/promtail:latest
    container_name: promtail

    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - "-config.file=/etc/promtail/config.yml"

    networks:
      - monitoring-network

    depends_on:
      - loki

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    depends_on:
      - prometheus
      - loki

    networks:
      - monitoring-network

    restart: unless-stopped


networks:
  monitoring-network:
    driver: bridge
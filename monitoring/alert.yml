groups:
  - name: logitrack-alerts

    rules:

      # API DOWN
      - alert: LogiTrackAPIDown
        expr: up{job="logitrack-api"} == 0
        for: 30s
        labels:
          severity: critical
          service: logitrack-api
        annotations:
          summary: "LogiTrack API is DOWN"
          description: "The LogiTrack Spring Boot API is not responding."

      # API disponible mais erreur HTTP
      - alert: LogiTrackHighHTTPErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{
              job="logitrack-api",
              status=~"5.."
            }[5m]))
            /
            sum(rate(http_server_requests_seconds_count{
              job="logitrack-api"
            }[5m]))
          ) > 0.05
        for: 1m
        labels:
          severity: warning
          service: logitrack-api
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of HTTP requests are returning 5xx errors."

      # JVM mémoire élevée
      - alert: LogiTrackHighMemoryUsage
        expr: |
          (
            sum(jvm_memory_used_bytes{
              job="logitrack-api",
              area="heap"
            })
            /
            sum(jvm_memory_max_bytes{
              job="logitrack-api",
              area="heap"
            })
          ) > 0.80
        for: 2m
        labels:
          severity: warning
          service: logitrack-api
        annotations:
          summary: "High JVM memory usage"
          description: "JVM heap memory usage is above 80%."

      # MySQL / API indirectement
      - alert: LogiTrackPrometheusTargetDown
        expr: up{job="logitrack-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "LogiTrack monitoring target is DOWN"
          description: "Prometheus cannot scrape the LogiTrack API."
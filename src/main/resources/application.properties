spring.application.name=LogiTrack

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/LogiTrack?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allow IntelliJ to ignore missing data source for now
spring.jpa.generate-ddl=true

jwt.secret=MaCleSecreteSuperLongueEtSecurisee1234567890!
jwt.expiration=86400000
